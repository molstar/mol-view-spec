[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molviewspec"
dynamic = ["version"]
description = "Generate Mol* views using a composable Python scene builder."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sebastian Bittrich" },
    { name = "Adam Midlik" },
    { name = "David Sehnal" },
]
keywords = [
    "molecular graphics",
    "scientific visualization",
    "web graphics",
    "view specification",
    "scene building",
    "Mol*",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=1,<3",
]

[project.urls]
Homepage = "https://github.com/molstar/mol-view-spec"
Changelog = "https://github.com/molstar/mol-view-spec/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "autoflake",
    "black",
    "fastapi==0.115.11",
    "isort",
    "mypy==1.1.1",
    "pydantic-settings>=2,<3",
    "requests",
    "types-requests",
    "uvicorn==0.32.0",
]

[tool.setuptools.dynamic]
version = { attr = "molviewspec.__version__" }

[tool.setuptools.packages.find]
include = ["molviewspec", "molviewspec.*"]

[tool.black]
line-length = 120
target-version = ['py310']
